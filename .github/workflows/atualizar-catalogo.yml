name: Atualizar catálogo

on:
  workflow_dispatch:
  schedule:
    - cron: '10 9 * * 5'
      timezone: "America/Sao_Paulo"

permissions: {}

concurrency:
  group: atualizar-catalogo-main
  cancel-in-progress: false

jobs:
  atualizar:
    if: github.repository == 'pietroneumann/evelin-boutique' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      # Pushes feitos com GITHUB_TOKEN não iniciam o build do Pages por si só.
      pages: write
    steps:
      - name: Obter main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Instalar dependências fixadas
        run: npm ci --ignore-scripts

      - name: Conferir Node e Chrome do runner
        run: |
          node --version
          command -v google-chrome
          google-chrome --version

      - name: Conferir main e a configuração existente do Pages
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/catalogo/publicar.mjs --preflight

      - name: Atualizar catálogo com validações
        id: catalogo
        run: |
          node scripts/atualizar-catalogo.mjs > "$RUNNER_TEMP/catalogo-relatorio.json"
          cat "$RUNNER_TEMP/catalogo-relatorio.json"
          cat "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/catalogo-resumo.md"

      - name: Testar os dados preparados e o atualizador
        run: |
          npm test
          node scripts/atualizar-catalogo.mjs --validate-only
          node --check script.js
          git diff --check

      - name: Criar commit validado, enviar e solicitar o build existente
        if: steps.catalogo.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CATALOG_BASE_SHA: ${{ steps.preflight.outputs.base_sha }}
          CATALOG_PUBLISH_ALLOWED: 'true'
        run: node scripts/catalogo/publicar.mjs --publish

      - name: Registrar falha sem publicar dados parciais
        if: failure()
        run: |
          printf '%s\n' '### Execução interrompida' 'Consulte a etapa que falhou. Validações impedem o commit/push de dados incompletos; nenhum envio usa force. Se o envio já ocorreu e somente o build do Pages falhou, o resumo da publicação identifica o commit enviado.' >> "$GITHUB_STEP_SUMMARY"

      - name: Exibir o resumo da validação
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/catalogo-resumo.md"; then
            cat "$RUNNER_TEMP/catalogo-resumo.md"
          else
            printf '%s\n' 'Resumo não gerado; consulte a etapa que falhou.'
          fi
